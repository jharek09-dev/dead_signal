<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#4a9e6b" stop-opacity="0.45"/>
      <stop offset="48%" stop-color="#4a9e6b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4a9e6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb87e"/>
      <stop offset="100%" stop-color="#3f8c5e"/>
    </linearGradient>
  </defs>

  <!-- dark square (the OS rounds the corners) -->
  <rect width="512" height="512" fill="#070707"/>
  <!-- soft green glow behind the bars (echoes the logo's text glow) -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- "dying signal" bars: three lit, the tallest (peak) dead/dim.
       group centered (x 99..413), bottom-aligned at y=388, in the maskable safe zone -->
  <g>
    <rect x="99"  y="278" width="62" height="110" rx="18" fill="url(#bar)"/>
    <rect x="183" y="223" width="62" height="165" rx="18" fill="url(#bar)"/>
    <rect x="267" y="168" width="62" height="220" rx="18" fill="url(#bar)"/>
    <rect x="351" y="108" width="62" height="280" rx="18" fill="#2b2b2b"/>
    <rect x="351" y="108" width="62" height="280" rx="18" fill="none" stroke="#3c3c3c" stroke-width="2"/>
  </g>
</svg>
